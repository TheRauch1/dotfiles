# Tuned for terminal Emacs (evil) over SSH/mosh from an iPad.

set -sg escape-time 0          # Esc reaches Emacs instantly
set -g mouse on                # touch/trackpad scroll + pane select
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # truecolor
set -g set-clipboard on        # OSC 52 copy to iPad clipboard
set -g allow-passthrough on
set -g extended-keys on        # modified keys (Shift+Enter etc.) for pi
set -as terminal-features ",xterm*:extkeys"
