# tmux for `dev` only (its own socket: tmux -L cockpit), so your own tmux
# setup is untouched. It is invisible on purpose: no status bar, no keys
# you need to learn. Its only job is to keep Neovim (and the agents inside
# it) running when the SSH connection drops or the laptop restarts. Run
# `dev` again to land back where you were.

set -g status off
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:hyperlinks,*:clipboard"
set -g set-clipboard on        # OSC 52 copy reaches Windows Terminal / Blink / Ghostty
set -g allow-passthrough on
set -g extended-keys on        # Shift+Enter etc. reach pi (see pi docs/tmux.md)
set -gq extended-keys-format csi-u   # tmux 3.5+; -q: ignored on older tmux
set -g detach-on-destroy on
set -g history-limit 5000
# A second device attaching takes over the size instead of shrinking to
# the smallest screen (laptop vs. monitor vs. iPad).
set -g window-size latest
set -g aggressive-resize on
