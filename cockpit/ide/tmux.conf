# `ide`: tmux in charge, one window (tab) per project, like VS Code with
# all your projects in one window:
#
#   ┌ tabs: projects, with their agent: ◐ working  ● your turn  ! approve ┐
#   │ Neovim (code, file tree, git panel)              │ agent (25%)      │
#
# Own socket (tmux -L ide), so your other tmux setups are untouched.
# Keys: prefix is Ctrl+b. prefix ? lists them all.

set -g escape-time 0
set -g focus-events on
set -g mouse on                       # click tabs and panes, drag borders, scroll
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:hyperlinks,*:clipboard"
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -gq extended-keys-format csi-u    # tmux 3.5+
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g window-size latest
set -g detach-on-destroy off          # closing a project goes to another, not out

# Tabs on top, like the Neovim cockpit.
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#21252b,fg=#abb2bf"
set -g status-left "#[fg=#21252b,bg=#61afef,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#5c6370]C-b p projects · g git · w waiting · ? keys "
set -g status-right-length 60
setw -g window-status-format " #I #W#($HOME/.config/cockpit/ide/dot.sh '#{@root}' '#{window_active}' '#W') "
setw -g window-status-current-format "#[bg=#3e4452,fg=#ffffff,bold] #I #W#($HOME/.config/cockpit/ide/dot.sh '#{@root}' '#{window_active}' '#W') "
setw -g window-status-separator "│"
setw -g pane-border-lines heavy
setw -g pane-border-style "fg=#3e4452"
setw -g pane-active-border-style "fg=#61afef"
setw -g pane-border-status off

# Projects
bind p   display-popup -E -w 70% -h 60% "$HOME/.config/cockpit/ide/pick-project.sh"
bind -n M-p display-popup -E -w 70% -h 60% "$HOME/.config/cockpit/ide/pick-project.sh"
bind w   run-shell "$HOME/.config/cockpit/ide/next-waiting.sh"
bind X   confirm-before -p "Close this project (editor + agent)? (y/n)" "run-shell '$HOME/.config/cockpit/ide/close-project.sh'"
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Editor <-> agent. Alt+a hops, Alt+z gives the current pane the whole window.
bind -n M-a if -F "#{==:#{pane_index},1}" "select-pane -t :.2" "select-pane -t :.1"
bind -n M-z resize-pane -Z
bind a   if -F "#{==:#{pane_index},1}" "select-pane -t :.2" "select-pane -t :.1"
# Agent width: prefix + / - (5 columns), prefix = back to 25 %.
bind + resize-pane -t :.2 -L 5
bind - resize-pane -t :.2 -R 5
bind = resize-pane -t :.2 -x 25%

# Git: lazygit in a big popup over the current project. A normal shell: prefix t.
bind g   display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "$HOME/.config/cockpit/ide/lazygit.sh"
bind -n M-g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "$HOME/.config/cockpit/ide/lazygit.sh"
bind t   display-popup -E -w 85% -h 75% -d "#{pane_current_path}"

bind ? display-popup -E -w 74 -h 30 "bash -c 'cat $HOME/.config/cockpit/ide/KEYS; read -rsn1'"
